<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EnLimpio · Panel interno</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --paper:#F2F0E8; --surface:#FBFAF6; --surface-2:#F6F4EC; --ink:#16302A; --ink-soft:#4C5C53;
    --ink-mute:#7A887E; --line:#E0DCCE; --line-2:#D2CDBB; --brand:#12463A; --brand-ink:#0C2E26;
    --accent:#1C9268; --accent-deep:#137254; --warm:#B96E22; --pos:#1C9268; --neg:#B84A3C;
    --shadow:0 1px 2px rgba(20,48,42,.06),0 12px 32px -12px rgba(20,48,42,.22);
    --shadow-sm:0 1px 2px rgba(20,48,42,.06),0 4px 12px -6px rgba(20,48,42,.16);
    --radius:14px;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --mono:'SF Mono',ui-monospace,'Roboto Mono',Menlo,Consolas,monospace;
    --st-nuevo:#6B7A8F; --st-rev:#B96E22; --st-listo:#1C9268; --st-vendido:#12463A;
  }
  @media (prefers-color-scheme:dark){ :root{
    --paper:#0E1A17; --surface:#15241F; --surface-2:#122019; --ink:#ECEFE9; --ink-soft:#A7B7AD;
    --ink-mute:#788A80; --line:#26362F; --line-2:#324740; --brand:#3FBF93; --brand-ink:#CFEFE2;
    --accent:#46C88C; --accent-deep:#38B37D; --warm:#E0A455; --pos:#46C88C; --neg:#E0796B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -16px rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 6px 16px -8px rgba(0,0,0,.5);
    --st-nuevo:#8FA0B5; --st-rev:#E0A455; --st-listo:#46C88C; --st-vendido:#3FBF93;
  }}
  :root[data-theme="dark"]{ --paper:#0E1A17;--surface:#15241F;--surface-2:#122019;--ink:#ECEFE9;--ink-soft:#A7B7AD;--ink-mute:#788A80;--line:#26362F;--line-2:#324740;--brand:#3FBF93;--accent:#46C88C;--accent-deep:#38B37D;--warm:#E0A455;--pos:#46C88C;--neg:#E0796B;--st-nuevo:#8FA0B5;--st-rev:#E0A455;--st-listo:#46C88C;--st-vendido:#3FBF93;--shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -16px rgba(0,0,0,.6);--shadow-sm:0 1px 2px rgba(0,0,0,.4),0 6px 16px -8px rgba(0,0,0,.5);}
  :root[data-theme="light"]{ --paper:#F2F0E8;--surface:#FBFAF6;--surface-2:#F6F4EC;--ink:#16302A;--ink-soft:#4C5C53;--ink-mute:#7A887E;--line:#E0DCCE;--line-2:#D2CDBB;--brand:#12463A;--accent:#1C9268;--accent-deep:#137254;--warm:#B96E22;--pos:#1C9268;--neg:#B84A3C;--st-nuevo:#6B7A8F;--st-rev:#B96E22;--st-listo:#1C9268;--st-vendido:#12463A;--shadow:0 1px 2px rgba(20,48,42,.06),0 12px 32px -12px rgba(20,48,42,.22);--shadow-sm:0 1px 2px rgba(20,48,42,.06),0 4px 12px -6px rgba(20,48,42,.16);}

  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.15;letter-spacing:-.01em;}
  .tnum{font-variant-numeric:tabular-nums;}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px;}

  /* Topbar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20;}
  .brand{display:inline-flex;align-items:center;gap:10px;}
  .badge{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#FBFAF6;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:13px;}
  @media (prefers-color-scheme:dark){.badge{color:#08120F;}} :root[data-theme="dark"] .badge{color:#08120F;} :root[data-theme="light"] .badge{color:#FBFAF6;}
  .brand b{font-family:var(--serif);font-weight:600;font-size:17px;} .brand .tag{font-size:11px;color:var(--ink-mute);border:1px solid var(--line-2);padding:2px 8px;border-radius:999px;margin-left:4px;}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line);}
  .kpi{background:var(--surface);padding:14px 20px;}
  .kpi .v{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em;} .kpi .l{font-size:12px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  @media (max-width:720px){.kpis{grid-template-columns:repeat(2,1fr);}}

  .layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 121px);}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}

  /* List */
  .list{border-right:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;}
  .list-tools{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);}
  .search{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;}
  .search:focus{outline:none;border-color:var(--accent);}
  .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .fpill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-soft);cursor:pointer;}
  .fpill.on{background:var(--brand);color:#FBFAF6;border-color:var(--brand);}
  @media (prefers-color-scheme:dark){.fpill.on{color:#08120F;}} :root[data-theme="dark"] .fpill.on{color:#08120F;} :root[data-theme="light"] .fpill.on{color:#FBFAF6;}
  .cases{overflow-y:auto;flex:1;}
  .case{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;}
  .case:hover{background:var(--surface);} .case.sel{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);}
  .case .cn{font-weight:650;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
  .case .cm{font-size:12.5px;color:var(--ink-mute);margin-top:3px;display:flex;justify-content:space-between;gap:8px;}
  .dot{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;}
  .dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--d);}

  /* Detail */
  .detail{padding:26px;overflow-y:auto;}
  .empty-detail{display:grid;place-items:center;height:100%;color:var(--ink-mute);text-align:center;padding:40px;}
  .d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .d-head h2{font-size:26px;} .d-head .sub{color:var(--ink-mute);font-size:13.5px;margin-top:4px;}
  .status-select{font:inherit;font-size:13.5px;font-weight:650;color:var(--ink);background:var(--surface);border:1.5px solid var(--line-2);border-radius:9px;padding:8px 12px;cursor:pointer;}
  .status-select:focus{outline:none;border-color:var(--accent);}

  .cards2{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start;}
  @media (max-width:920px){.cards2{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
  .card .ch{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:650;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .card .cb{padding:6px 18px 14px;}

  .li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);}
  .li:last-child{border-bottom:0;} .li .lk{color:var(--ink-soft);font-size:14px;} .li .lv{font-family:var(--mono);font-size:14.5px;font-weight:600;}
  .li.tot{border-top:2px solid var(--ink);border-bottom:0;margin-top:2px;padding-top:13px;}
  .li.tot .lk{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:16px;} .li.tot .lv{font-size:19px;font-weight:700;color:var(--pos);}
  .neg{color:var(--neg);}
  .kpi3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);}
  .kpi3 .k{padding:12px;text-align:center;border-right:1px solid var(--line);} .kpi3 .k:last-child{border-right:0;}
  .kpi3 .kv{font-family:var(--mono);font-size:17px;font-weight:700;} .kpi3 .kl{font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  .finding{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line);}
  .finding:last-child{border-bottom:0;} .finding p{font-size:14px;color:var(--ink-soft);}
  .fic{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:13px;}
  .fic.a{background:color-mix(in srgb,var(--warm) 15%,transparent);color:var(--warm);border:1px solid color-mix(in srgb,var(--warm) 30%,transparent);}
  .fic.i{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent-deep);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);}
  .no-find{color:var(--ink-mute);font-size:13.5px;padding:10px 0;}
  .notas{margin-top:8px;} .notas textarea{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;resize:vertical;min-height:70px;}
  .notas textarea:focus{outline:none;border-color:var(--accent);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .btn{display:inline-flex;align-items:center;gap:.5em;font:inherit;font-weight:650;font-size:14px;padding:11px 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;transition:transform .15s,border-color .15s;}
  .btn:hover{transform:translateY(-1px);border-color:var(--ink-soft);}
  .btn.primary{background:var(--brand);color:#FBFAF6;border-color:var(--brand);}
  @media (prefers-color-scheme:dark){.btn.primary{color:#08120F;}} :root[data-theme="dark"] .btn.primary{color:#08120F;} :root[data-theme="light"] .btn.primary{color:#FBFAF6;}
  .banner{background:color-mix(in srgb,var(--warm) 12%,transparent);border:1px solid color-mix(in srgb,var(--warm) 30%,transparent);color:var(--ink-soft);font-size:12.5px;padding:9px 22px;text-align:center;}
</style>
</head>
<body>
  <div class="top">
    <span class="brand"><span class="badge">EL</span><b>EnLimpio</b><span class="tag">Panel interno</span></span>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn" id="themeBtn" aria-label="Tema" style="padding:8px 12px;">◐</button>
    </div>
  </div>
  <div class="banner">Versión de prueba con datos de ejemplo. Los cambios de estado y notas se guardan solo en este navegador. En producción va detrás de login + base de datos real.</div>

  <div class="kpis" id="kpis"></div>

  <div class="layout">
    <aside class="list">
      <div class="list-tools">
        <input class="search" id="search" type="search" placeholder="Buscar negocio o contacto…" />
        <div class="filters" id="filters"></div>
      </div>
      <div class="cases" id="cases"></div>
    </aside>
    <main class="detail" id="detail">
      <div class="empty-detail">Elegí un caso de la lista para revisarlo.</div>
    </main>
  </div>

<script>
  const WHATSAPP_HINT = ""; // opcional
  const ESTADOS = {
    "nuevo":        { label:"Nuevo",         color:"var(--st-nuevo)" },
    "en-revision":  { label:"En revisión",   color:"var(--st-rev)" },
    "informe-listo":{ label:"Informe listo", color:"var(--st-listo)" },
    "vendido":      { label:"Vendido",       color:"var(--st-vendido)" }
  };
  const fmt = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Math.round(n));
  const pct = n => (Math.round(n*10)/10).toLocaleString('es-AR') + "%";

  let CASOS = [], selId = null, filter = "todos", query = "";
  const overlay = JSON.parse(localStorage.getItem("enlimpio-panel") || "{}"); // {id:{estado,notas}}
  const saveOverlay = () => localStorage.setItem("enlimpio-panel", JSON.stringify(overlay));
  const merged = c => ({ ...c, ...(overlay[c.id]||{}) });

  fetch("data/casos.json")
    .then(r => r.json())
    .then(d => { CASOS = d; render(); })
    .catch(() => {
      document.getElementById("cases").innerHTML =
        `<div style="padding:20px;color:var(--ink-mute);font-size:13.5px;">No se pudo cargar <code>data/casos.json</code>. Serví el sitio por HTTP (no abras el archivo directo).</div>`;
    });

  function computed(c){
    const gananciaBruta = c.ventas - c.cmv;
    const resultado = gananciaBruta - c.gastosComprobante - c.gastosEfectivo;
    const margen = c.ventas ? gananciaBruta / c.ventas * 100 : 0;
    const rent = c.ventas ? resultado / c.ventas * 100 : 0;
    const gastoTotal = c.gastosComprobante + c.gastosEfectivo;
    const pctSinComp = gastoTotal ? c.gastosEfectivo / gastoTotal * 100 : 0;
    return { gananciaBruta, resultado, margen, rent, pctSinComp };
  }

  function render(){
    // KPIs
    const counts = { nuevo:0, "en-revision":0, "informe-listo":0, vendido:0 };
    CASOS.forEach(c => counts[merged(c).estado]++);
    const conv = CASOS.length ? counts.vendido / CASOS.length * 100 : 0;
    document.getElementById("kpis").innerHTML = `
      <div class="kpi"><div class="v tnum" style="color:var(--st-nuevo)">${counts.nuevo}</div><div class="l">Nuevos</div></div>
      <div class="kpi"><div class="v tnum" style="color:var(--st-rev)">${counts["en-revision"]}</div><div class="l">En revisión</div></div>
      <div class="kpi"><div class="v tnum" style="color:var(--st-listo)">${counts["informe-listo"]}</div><div class="l">Informes listos</div></div>
      <div class="kpi"><div class="v tnum">${pct(conv)}</div><div class="l">Conversión</div></div>`;

    // Filters
    const fEl = document.getElementById("filters");
    const opts = [["todos","Todos"], ...Object.entries(ESTADOS).map(([k,v])=>[k,v.label])];
    fEl.innerHTML = opts.map(([k,l]) => `<button class="fpill ${filter===k?'on':''}" data-f="${k}">${l}</button>`).join("");
    fEl.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });

    // List
    const list = CASOS.filter(c => {
      const m = merged(c);
      const okF = filter==="todos" || m.estado===filter;
      const okQ = !query || (c.negocio+" "+c.contacto+" "+c.rubro).toLowerCase().includes(query.toLowerCase());
      return okF && okQ;
    });
    document.getElementById("cases").innerHTML = list.length ? list.map(c => {
      const m = merged(c), e = ESTADOS[m.estado];
      return `<div class="case ${c.id===selId?'sel':''}" data-id="${c.id}">
        <div class="cn"><span>${c.negocio}</span><span class="dot" style="--d:${e.color}">${e.label}</span></div>
        <div class="cm"><span>${c.rubro} · ${c.mes}</span><span>${fmt(c.ventas)}</span></div>
      </div>`;
    }).join("") : `<div style="padding:20px;color:var(--ink-mute);font-size:13.5px;">Sin casos para este filtro.</div>`;
    document.querySelectorAll(".case").forEach(el => el.onclick = () => { selId = el.dataset.id; render(); renderDetail(); });

    if(selId) renderDetail();
  }

  function renderDetail(){
    const c0 = CASOS.find(c => c.id===selId); if(!c0) return;
    const c = merged(c0), k = computed(c0), e = ESTADOS[c.estado];
    const findings = c0.hallazgos && c0.hallazgos.length
      ? c0.hallazgos.map(h => `<div class="finding"><span class="fic ${h.tipo==='alerta'?'a':'i'}">${h.tipo==='alerta'?'!':'i'}</span><p>${h.texto}</p></div>`).join("")
      : `<div class="no-find">Sin hallazgos cargados todavía.</div>`;

    document.getElementById("detail").innerHTML = `
      <div class="d-head">
        <div>
          <h2>${c0.negocio}</h2>
          <div class="sub">${c0.rubro} · ${c0.mes} · ${c0.contacto} · recibido ${c0.recibido}</div>
        </div>
        <select class="status-select" id="statusSel">
          ${Object.entries(ESTADOS).map(([kk,v])=>`<option value="${kk}" ${c.estado===kk?'selected':''}>${v.label}</option>`).join("")}
        </select>
      </div>
      <div class="cards2">
        <div class="card">
          <div class="ch">Estado de resultados — ${c0.mes}</div>
          <div class="cb">
            <div class="li"><span class="lk">Ventas netas (sin IVA)</span><span class="lv tnum">${fmt(c0.ventas)}</span></div>
            <div class="li"><span class="lk">Costo de mercadería</span><span class="lv neg tnum">− ${fmt(c0.cmv)}</span></div>
            <div class="li"><span class="lk">Ganancia bruta</span><span class="lv tnum">${fmt(k.gananciaBruta)}</span></div>
            <div class="li"><span class="lk">Gastos con comprobante</span><span class="lv neg tnum">− ${fmt(c0.gastosComprobante)}</span></div>
            <div class="li"><span class="lk">Gastos en efectivo</span><span class="lv neg tnum">− ${fmt(c0.gastosEfectivo)}</span></div>
            <div class="li tot"><span class="lk">Resultado del mes</span><span class="lv tnum">${fmt(k.resultado)}</span></div>
          </div>
          <div class="kpi3">
            <div class="k"><div class="kv tnum">${pct(k.margen)}</div><div class="kl">Margen bruto</div></div>
            <div class="k"><div class="kv tnum">${pct(k.rent)}</div><div class="kl">Rentabilidad</div></div>
            <div class="k"><div class="kv tnum" style="color:${k.pctSinComp>35?'var(--warm)':'var(--ink)'}">${pct(k.pctSinComp)}</div><div class="kl">Gasto s/comprob.</div></div>
          </div>
        </div>
        <div class="card">
          <div class="ch">Hallazgos para el informe</div>
          <div class="cb">
            ${findings}
            <div class="notas">
              <div style="font-size:12px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;">Notas internas</div>
              <textarea id="notas" placeholder="Notas de Pablo…">${c.notas || ""}</textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="firmar">✓ Marcar informe listo (firma de Pablo)</button>
        <a class="btn" href="estimador.html" target="_blank">Abrir estimador</a>
        <button class="btn" id="copiar">Copiar resumen</button>
      </div>`;

    const setState = (est) => { overlay[c0.id] = { ...(overlay[c0.id]||{}), estado: est, notas: document.getElementById("notas").value }; saveOverlay(); render(); renderDetail(); };
    document.getElementById("statusSel").onchange = ev => setState(ev.target.value);
    document.getElementById("firmar").onclick = () => setState("informe-listo");
    document.getElementById("notas").onblur = () => { overlay[c0.id] = { ...(overlay[c0.id]||{}), notas: document.getElementById("notas").value }; saveOverlay(); };
    document.getElementById("copiar").onclick = () => {
      const txt = `${c0.negocio} — ${c0.mes}\nResultado: ${fmt(k.resultado)} · Margen ${pct(k.margen)} · Rent. ${pct(k.rent)}\nHallazgos:\n${(c0.hallazgos||[]).map(h=>"• "+h.texto).join("\n")}`;
      navigator.clipboard?.writeText(txt);
      document.getElementById("copiar").textContent = "¡Copiado!";
      setTimeout(()=>{ const b=document.getElementById("copiar"); if(b) b.textContent="Copiar resumen"; }, 1400);
    };
  }

  document.getElementById("search").addEventListener("input", e => { query = e.target.value; render(); });

  // Theme
  const root = document.documentElement;
  const stored = localStorage.getItem("enlimpio-theme"); if(stored) root.setAttribute("data-theme", stored);
  document.getElementById("themeBtn").onclick = () => {
    const isDark = getComputedStyle(root).getPropertyValue("--paper").trim().toLowerCase().startsWith("#0");
    const next = isDark ? "light" : "dark"; root.setAttribute("data-theme", next); localStorage.setItem("enlimpio-theme", next);
  };
</script>
</body>
</html>
